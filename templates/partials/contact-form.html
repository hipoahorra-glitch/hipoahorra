{{ define "contact-form.html" }}
<section id="contacto" class="px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto grid max-w-7xl gap-8 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
        <div>
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.25em] text-slateblue">Asesoramiento</p>
            <h2 class="text-3xl font-semibold text-slate-800">¿Quiere que revisemos su caso?</h2>
            <p class="mt-4 max-w-xl text-slate-600">Puede dejar sus datos y le contactaremos para hablar de su hipoteca
                con un enfoque sencillo y claro.</p>
        </div>

        <div class="rounded-3xl border border-stone-200 bg-white p-6 shadow-[0_25px_80px_rgba(15,23,42,0.06)] sm:p-8">
            <form data-contact-form action="/contacto" method="post" class="space-y-4">
                <label class="flex flex-col gap-2 text-sm font-medium text-slate-700">
                    <span>Nombre</span>
                    <input type="text" name="name" required
                        class="rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-slateblue" />
                </label>
                <label class="flex flex-col gap-2 text-sm font-medium text-slate-700">
                    <span>Email</span>
                    <input type="email" name="email" required
                        class="rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-slateblue" />
                </label>
                <label class="flex flex-col gap-2 text-sm font-medium text-slate-700">
                    <span>Teléfono</span>
                    <input type="tel" name="phone"
                        class="rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-slateblue" />
                </label>
                <label class="flex flex-col gap-2 text-sm font-medium text-slate-700">
                    <span>Importe pendiente de hipoteca</span>
                    <input type="number" step="0.01" name="pendingAmount"
                        class="rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-slateblue" />
                </label>
                <label class="flex flex-col gap-2 text-sm font-medium text-slate-700">
                    <span>Mensaje</span>
                    <textarea name="message" rows="4"
                        class="rounded-2xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none transition focus:border-slateblue"></textarea>
                </label>
                <button type="submit"
                    class="w-full rounded-full bg-slateblue px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-slateblue/20 transition hover:-translate-y-0.5">Enviar
                    consulta</button>
                <p data-contact-status class="hidden rounded-xl p-3 text-sm font-semibold" role="status"></p>
            </form>
        </div>
    </div>
</section>
{{ end }}
