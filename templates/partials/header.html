{{ define "header.html" }}
<header class="sticky top-0 z-20 border-b border-stone-200/80 bg-stone-50/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a href="#top" class="text-lg font-semibold tracking-tight text-slate-800">HipoAhorro</a>
        <nav class="hidden gap-6 text-sm text-slate-600 md:flex">
            <a href="#simulador" class="transition hover:text-slateblue">Simular</a>
            {{ if .showResults }}
            <a href="#resultados" class="transition hover:text-slateblue">Resultados</a>
            {{ end }}
            <a href="#contacto" class="transition hover:text-slateblue">Contactar</a>
        </nav>
    </div>
</header>
{{ end }}
